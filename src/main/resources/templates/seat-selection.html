<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좌석 선택 - 코레일</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/nav.css">
</head>
<body>

<header>
    <div class="util-bar">
        <a href="/loginForm">로그인</a>
        <span class="util-sep">|</span>
        <a href="/logout">로그아웃</a>
    </div>
    <div class="header-inner">
        <a href="/" class="logo">
            <div class="logo-mark">K</div>
            <span class="logo-text">KORAIL</span>
        </a>
        <nav class="main-nav">
            <a href="/">홈</a>
            <a href="/reservation" class="active">예약하기</a>
            <a href="/admin/list">기차 목록</a>
            <a href="/user">마이페이지</a>
            <a href="/support">고객센터</a>
            <a href="/reservation" class="nav-cta">승차권 예매</a>
        </nav>
    </div>
</header>

<div class="page-wrap medium">
    <div class="page-title">좌석 선택</div>

    <div class="seat-info-card">
        <div class="info-item">
            <label>기차 번호</label>
            <span th:text="${trainId}">101</span>
        </div>
        <div class="info-item">
            <label>출발역</label>
            <span th:text="${train.departureStation}">서울</span>
        </div>
        <div class="info-item">
            <label>도착역</label>
            <span th:text="${train.arrivalStation}">부산</span>
        </div>
    </div>

    <div class="seat-legend">
        <div class="leg-item"><div class="dot dot-available"></div> 예매 가능</div>
        <div class="leg-item"><div class="dot dot-reserved"></div> 매진</div>
        <div class="leg-item"><div class="dot dot-selected"></div> 선택됨</div>
    </div>

    <form action="/seat-selection/reserve" method="post" id="seatForm">
        <input type="hidden" name="trainId" th:value="${trainId}">

        <div class="seat-grid">
            <th:block th:each="seat : ${availableSeats}">
                <th:block th:if="${#strings.trim(seat.status) == 'AVAILABLE'}">
                    <label style="cursor:pointer;">
                        <input type="checkbox" name="selectedSeatIds" th:value="${seat.seatId}"
                               style="display:none;"
                               onchange="toggleSeat(this)">
                        <div class="seat-btn" th:id="'seat-' + ${seat.seatId}" th:text="${seat.seatNumber}">1A</div>
                    </label>
                </th:block>
                <th:block th:if="${#strings.trim(seat.status) != 'AVAILABLE'}">
                    <div class="seat-btn reserved" th:text="${seat.seatNumber}">1B</div>
                </th:block>
            </th:block>
        </div>

        <div class="text-center mt-24">
            <button type="submit" class="btn btn-danger btn-lg">선택한 좌석 예매하기</button>
        </div>
    </form>
</div>

<footer>
    <div class="footer-inner">
        <div>
            <div class="footer-logo">KORAIL</div>
            <div style="margin-top:6px;">© 2025 코레일. All rights reserved.</div>
        </div>
    </div>
</footer>

<script>
    function toggleSeat(checkbox) {
        const seatDiv = document.getElementById('seat-' + checkbox.value);
        if (!seatDiv) return;
        if (checkbox.checked) {
            seatDiv.classList.add('selected');
        } else {
            seatDiv.classList.remove('selected');
        }
    }
</script>

</body>
</html>
