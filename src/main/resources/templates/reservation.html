<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승차권 예매 - 코레일</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/nav.css">
</head>
<body>

<header>
    <div class="util-bar">
        <a href="/loginForm">로그인</a>
        <span class="util-sep">|</span>
        <a href="/joinForm">회원가입</a>
        <span class="util-sep">|</span>
        <a href="/logout">로그아웃</a>
    </div>
    <div class="header-inner">
        <a href="/" class="logo">
            <div class="logo-mark">K</div>
            <span class="logo-text">KORAIL</span>
        </a>
        <nav class="main-nav">
            <a href="/">홈</a>
            <a href="/reservation" class="active">예약하기</a>
            <a href="/admin/list">기차 목록</a>
            <a href="/user">마이페이지</a>
            <a href="/support">고객센터</a>
            <a href="/reservation" class="nav-cta">승차권 예매</a>
        </nav>
    </div>
</header>

<div class="page-wrap medium">
    <div class="page-title">승차권 예매</div>

    <div class="train-list">
        <th:block th:each="train : ${trains}">
            <div class="train-card">
                <div class="train-type" th:classappend="${train.trainType == 'KTX' ? 'ktx' : ''}" th:text="${train.trainType}">KTX</div>
                <div class="train-route">
                    <div>
                        <div class="station" th:text="${train.departureStation}">서울</div>
                        <div class="station-time" th:text="${train.departureTime}">08:00</div>
                    </div>
                    <div class="route-arrow">→</div>
                    <div>
                        <div class="station" th:text="${train.arrivalStation}">부산</div>
                        <div class="station-time" th:text="${train.arrivalTime}">10:30</div>
                    </div>
                </div>
                <div class="train-meta">
                    <div class="seat-count">잔여 <span th:text="${train.availableSeats}">50</span>석</div>
                    <a th:if="${train.availableSeats > 0}"
                       th:href="@{'/seat-selection?trainId=' + ${train.trainId}}"
                       class="btn btn-primary">예매하기</a>
                    <span th:if="${train.availableSeats == 0}" class="badge badge-soldout">매진</span>
                </div>
            </div>
        </th:block>
    </div>
</div>

<footer>
    <div class="footer-inner">
        <div>
            <div class="footer-logo">KORAIL</div>
            <div style="margin-top:6px;">© 2025 코레일. All rights reserved.</div>
        </div>
        <div class="footer-links">
            <a href="/support">고객센터</a>
            <a href="/support">이용약관</a>
        </div>
    </div>
</footer>

</body>
</html>
