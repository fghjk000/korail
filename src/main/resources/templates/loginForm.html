<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 페이지</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css">
  <link rel="stylesheet" type="text/css" href="/css/nav.css">
</head>
<body>
<header>
  <nav>
    <a href="/" class="logo">홈</a>
    <a href="/reservation">예약하기</a>
    <a href="/admin/list">기차 목록</a>
    <a href="/user">마이페이지</a>
    <a href="/support">고객센터</a>
    <a href="/logout">로그아웃</a>
    <a href="/loginForm">로그인</a>
  </nav>
</header>

<main>
  <section class="login-container">
    <h1>로그인 페이지</h1>
    <form action="/login" method="POST" class="login-form">
      <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
      </div>

      <button type="submit" class="submit-btn">로그인</button>
    </form>

    <div class="additional-links">
      <a href="/oauth2/authorization/google" class="google-login">구글 로그인</a>
      <a href="/joinForm" class="join-link">회원가입을 아직 하지 않으셨나요?</a>
    </div>
  </section>
</main>

<footer>
  <p>© 2025 코레일. All rights reserved.</p>
</footer>
</body>
</html>
