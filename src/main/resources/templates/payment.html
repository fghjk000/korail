<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 - 코레일</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/nav.css">
</head>
<body>

<header>
    <div class="util-bar">
        <a href="/loginForm">로그인</a>
        <span class="util-sep">|</span>
        <a href="/logout">로그아웃</a>
    </div>
    <div class="header-inner">
        <a href="/" class="logo">
            <div class="logo-mark">K</div>
            <span class="logo-text">KORAIL</span>
        </a>
        <nav class="main-nav">
            <a href="/">홈</a>
            <a href="/reservation" class="active">예약하기</a>
            <a href="/admin/list">기차 목록</a>
            <a href="/user">마이페이지</a>
            <a href="/support">고객센터</a>
        </nav>
    </div>
</header>

<div class="page-wrap narrow" style="max-width:600px;">
    <div class="page-title">결제</div>

    <div class="card">
        <div class="card-header">기차 정보</div>
        <div class="card-body">
            <div class="payment-summary">
                <dl>
                    <dt>기차 번호</dt>
                    <dd th:text="${train.trainNumber}">KTX 101</dd>
                    <dt>출발지</dt>
                    <dd th:text="${train.departureStation}">서울</dd>
                    <dt>도착지</dt>
                    <dd th:text="${train.arrivalStation}">부산</dd>
                    <dt>출발 시간</dt>
                    <dd th:text="${train.departureTime}">08:00</dd>
                    <dt>도착 시간</dt>
                    <dd th:text="${train.arrivalTime}">10:30</dd>
                </dl>
                <div class="payment-total">10,000원</div>
            </div>

            <div style="margin-bottom:12px;">
                <strong style="font-size:13px; color:#555;">선택한 좌석</strong>
                <p id="selectedSeatsList" style="margin-top:6px; font-size:14px; color:#003087; font-weight:700;"></p>
            </div>
        </div>
    </div>

    <form action="/payment" method="POST">
        <div class="card">
            <div class="card-header">결제 정보</div>
            <div class="card-body">
                <div class="form-group">
                    <label for="paymentMethod">결제 방법</label>
                    <select id="paymentMethod" name="paymentMethod" required>
                        <option value="creditCard">신용카드</option>
                        <option value="bankTransfer">계좌이체</option>
                        <option value="paypal">페이팔</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">결제 금액</label>
                    <input type="text" id="amount" name="amount" value="10000" readonly>
                </div>

                <input type="hidden" name="trainNumber" th:value="${train.trainNumber}">
                <input type="hidden" id="seatIds" name="seatIds" th:value="${seatIds}">

                <div class="form-row mt-16">
                    <button type="button" class="btn btn-secondary btn-lg"
                            onclick="location.href='/reservation'">취소</button>
                    <button type="submit" class="btn btn-danger btn-lg">결제하기</button>
                </div>
            </div>
        </div>
    </form>
</div>

<footer>
    <div class="footer-inner">
        <div class="footer-logo">KORAIL</div>
        <div>© 2025 코레일. All rights reserved.</div>
    </div>
</footer>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const seatIds = urlParams.get('seatIds');
    if (seatIds) {
        document.getElementById('selectedSeatsList').textContent = seatIds.split(',').join(', ');
    }
</script>

</body>
</html>
