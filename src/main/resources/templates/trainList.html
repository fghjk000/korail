<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기차 목록 - 코레일</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/nav.css">
</head>
<body>

<header>
    <div class="util-bar">
        <a href="/loginForm">로그인</a>
        <span class="util-sep">|</span>
        <a href="/logout">로그아웃</a>
    </div>
    <div class="header-inner">
        <a href="/" class="logo">
            <div class="logo-mark">K</div>
            <span class="logo-text">KORAIL</span>
        </a>
        <nav class="main-nav">
            <a href="/">홈</a>
            <a href="/reservation">예약하기</a>
            <a href="/admin/list" class="active">기차 목록</a>
            <a href="/user">마이페이지</a>
            <a href="/support">고객센터</a>
            <a href="/reservation" class="nav-cta">승차권 예매</a>
        </nav>
    </div>
</header>

<div class="page-wrap">
    <div class="admin-notice">관리자 전용 페이지입니다. 기차 정보를 추가하거나 확인할 수 있습니다.</div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <div class="page-title" style="margin-bottom:0; border-bottom:none;">기차 목록</div>
        <a href="/admin/trainForm" class="btn btn-primary">+ 기차 추가</a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>기차 번호</th>
                    <th>기차 유형</th>
                    <th>출발역</th>
                    <th>도착역</th>
                    <th>출발 시간</th>
                    <th>도착 시간</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="train : ${trainList}">
                    <td th:text="${train.trainNumber}"></td>
                    <td>
                        <span class="badge badge-reserved" th:text="${train.trainType}">KTX</span>
                    </td>
                    <td th:text="${train.departureStation}"></td>
                    <td th:text="${train.arrivalStation}"></td>
                    <td th:text="${train.departureTime}"></td>
                    <td th:text="${train.arrivalTime}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer>
    <div class="footer-inner">
        <div>
            <div class="footer-logo">KORAIL</div>
            <div style="margin-top:6px;">© 2025 코레일. All rights reserved.</div>
        </div>
    </div>
</footer>

</body>
</html>
