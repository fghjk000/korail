<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 - 코레일 예약 시스템</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css"> <!-- 기존 스타일 -->
    <link rel="stylesheet" type="text/css" href="/css/nav.css"> <!-- nav 스타일 -->
</head>
<body>
<header>
    <nav>
        <a href="/" class="logo">홈</a>
        <a href="/reservation">예약하기</a>
        <a href="/admin/list">기차 목록</a>
        <a href="/user">마이페이지</a>
        <a href="/support">고객센터</a>
        <a href="/logout">로그아웃</a>
        <a href="/loginForm">로그인</a>
    </nav>
</header>
<h1>코레일 예약 시스템</h1>
<section>
    <h2>마이페이지</h2>
    <!-- 로그인한 사용자 이름 동적으로 출력 -->
    <p>안녕하세요, <strong th:text="${user.username}">홍길동</strong>님! 여기서 예약 내역을 확인하고 관리하실 수 있습니다.</p>

    <!-- 예약 정보 표시 -->
    <h3>예약 내역</h3>
    <table>
        <thead>
        <tr>
            <th>예약 번호</th>
            <th>출발역</th>
            <th>도착역</th>
            <th>출발 일시</th>
            <th>도착 일시</th>
            <th>상태</th>
        </tr>
        </thead>
        <tbody>
        <!-- 예약 내역이 없을 경우 -->
        <tr th:if="${message != null}">
            <td colspan="6" style="text-align: center;" th:text="${message}">예약 내역이 없습니다.</td>
        </tr>

        <!-- 예약 내역이 있을 경우 -->
        <tr th:each="reservation : ${reservations}">
            <td th:text="${reservation.reservationId}"></td>
            <td th:text="${reservation.departureStation}"></td>
            <td th:text="${reservation.arrivalStation}"></td>
            <td th:text="${#dates.format(reservation.departureDate, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${#dates.format(reservation.arrivalDate, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${reservation.status}"></td>
        </tr>
        </tbody>
    </table>

    <!-- 개인 정보 수정 -->
    <h3>개인 정보 수정</h3>
    <form th:action="@{/user/{userId}(userId=${user.userId})}" method="POST">
        <input type="hidden" name="_method" value="PUT"> <!-- PUT 요청을 위한 hidden input -->

        <label for="username">아이디:</label>
        <input type="text" id="username" name="username" th:value="${user.username}" required readonly><br><br>

        <label for="password">비밀번호:</label>
        <input type="password" id="password" name="password"><br><br> <!-- 비밀번호는 공백 가능 -->

        <label for="email">이메일:</label>
        <input type="email" id="email" name="email" th:value="${user.email}" required><br><br>

        <label for="phoneNumber">전화번호:</label>
        <input type="text" id="phoneNumber" name="phoneNumber" th:value="${user.phoneNumber}" required><br><br>

        <input type="submit" value="수정하기">
    </form>

</section>

<footer>
    <p>&copy; 2025 코레일 예약 시스템. All rights reserved.</p>
</footer>
</body>
</html>
