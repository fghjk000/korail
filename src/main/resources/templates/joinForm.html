<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 코레일</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/nav.css">
</head>
<body class="auth-wrap">

<header>
    <div class="header-inner">
        <a href="/" class="logo">
            <div class="logo-mark">K</div>
            <span class="logo-text">KORAIL</span>
        </a>
    </div>
</header>

<div class="auth-body">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-mark">K</div>
            <span class="logo-text">KORAIL</span>
        </div>
        <h2>회원가입</h2>

        <form action="/join" method="POST">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="이메일을 입력하세요" required>
            </div>
            <div class="form-group">
                <label for="phoneNumber">전화번호</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="전화번호를 입력하세요" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">가입하기</button>
        </form>

        <div class="auth-footer-links">
            <span>이미 회원이신가요?</span>
            <a href="/loginForm">로그인</a>
        </div>
    </div>
</div>

<footer>
    <div class="footer-inner">
        <div class="footer-logo">KORAIL</div>
        <div>© 2025 코레일. All rights reserved.</div>
    </div>
</footer>

</body>
</html>
